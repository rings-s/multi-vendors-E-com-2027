# Local development stack: PostgreSQL, Redis, migrations, FastAPI backend and SvelteKit frontend.
#   make up            (or: cp .env.example .env && docker compose up --build)
#   make seed          demo data (mock payments only)
#   make superuser     create a SUPER_ADMIN
#   make flush         wipe the database and re-apply migrations
# Run `make help` for every command.
name: marketplace

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:-marketplace}@postgres:5432/${POSTGRES_DB:-marketplace}
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marketplace}
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies Alembic migrations, then exits. The backend waits for it.
  migrate:
    build:
      context: apps/backend
      target: runtime
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    volumes:
      # New migrations apply without rebuilding the image. `z` relabels bind mounts
      # for SELinux hosts (Fedora/openSUSE); it is ignored elsewhere.
      - ./apps/backend/app:/app/app:ro,z
      - ./apps/backend/migrations:/app/migrations:ro,z
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: apps/backend
      target: dev
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./apps/backend/app:/app/app:z
      - ./apps/backend/migrations:/app/migrations:z
      - uploads:/app/var/uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # SvelteKit dev server. It proxies /api/v1/* and /media/* to the backend, so the
  # browser only talks to http://localhost:5173 (must match the backend FRONTEND_URL).
  frontend:
    build:
      context: apps/frontend
      target: dev
    environment:
      API_URL: http://backend:8000
      CI: "true"
    command: ["sh", "-c", "pnpm install --frozen-lockfile --prefer-offline && exec pnpm dev --host 0.0.0.0 --port 5173 --strictPort"]
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./apps/frontend:/app:z
      - frontend-node-modules:/app/node_modules
      - frontend-svelte-kit:/app/.svelte-kit
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  uploads:
  frontend-node-modules:
  frontend-svelte-kit:
